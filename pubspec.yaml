name: claimly_app
description: A micro-insurance app for South African workers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.2.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Networking
  dio: ^5.4.0
  
  # Image & File
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  permission_handler: ^11.3.0
  
  # Notifications (Local only for now)
  flutter_local_notifications: ^17.0.0
  
  # Utility
  intl: ^0.19.0
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.5
  share_plus: ^7.2.1
  
  # PDF
  pdf: ^3.10.7
  printing: ^5.11.1